name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haroteru_test
          POSTGRES_PASSWORD: haroteru_test
          POSTGRES_DB: haroteru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haroteru_test -d haroteru_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://haroteru_test:haroteru_test@127.0.0.1:5432/haroteru_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests with PostgreSQL migrations and operation receipts
        run: go test -count=1 ./...

  frontend:
    name: Frontend Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node.js version
        run: node -e "const fs = require('node:fs'); const expected = 'v' + fs.readFileSync('../.nvmrc', 'utf8').trim(); if (process.version !== expected) process.exit(1); console.log(process.version)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haroteru_e2e
          POSTGRES_PASSWORD: haroteru_e2e
          POSTGRES_DB: haroteru_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haroteru_e2e -d haroteru_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node.js version
        run: node -e "const fs = require('node:fs'); const expected = 'v' + fs.readFileSync('../.nvmrc', 'utf8').trim(); if (process.version !== expected) process.exit(1); console.log(process.version)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          PLAYWRIGHT_E2E_DATABASE_URL: postgres://haroteru_e2e:haroteru_e2e@127.0.0.1:5432/haroteru_e2e?sslmode=disable
          PLAYWRIGHT_E2E_DEV_AUTH_CODE: playwright-dev-code
